!
! Switch1 (Ethernet switch) – Práctica P1
! Diomedes Mateo Alvarez – 20250873
! En GNS3 se usa un switch de capa 2; este archivo documenta los vlans
! por si se sustituye por un switch Cisco IOSvL2.
!
hostname Switch1
!
vlan 10
 name AREAS
!
interface range GigabitEthernet0/1 - 4
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
!
interface GigabitEthernet0/5
 switchport mode trunk
 switchport trunk allowed vlan 10
!
end
