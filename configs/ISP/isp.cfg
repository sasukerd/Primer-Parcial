hostname ISP
!
interface GigabitEthernet0/0
 description Enlace hacia FortiGate
 ip address 203.0.113.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description Enlace hacia BRANCH
 ip address 192.0.2.1 255.255.255.252
 no shutdown
