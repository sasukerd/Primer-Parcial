 no shutdown
!
ip route 0.0.0.0 0.0.0.0 GigabitEthernet0/2
ip route 192.168.10.0 255.255.255.0 203.0.113.2
ip route 10.0.0.0 255.255.255.0 192.0.2.2
!
end
